<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f7f9fc;
    }

    header {
      background-color: #0096c7;
      color: white;
      padding: 10px 20px;
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: center;
      background-color: #00b4d8;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      display: block;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    nav a:hover {
      background-color: #0077b6;
    }

    section {
      padding: 20px;
    }

    h2 {
      color: #0077b6;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: center;
    }

    th {
      background-color: #90e0ef;
    }

    /* Couleurs selon le nombre d'absences */
    .good {
      background-color: #d4edda; /* vert clair */
    }
    .warning {
      background-color: #fff3cd; /* jaune clair */
    }
    .bad {
      background-color: #f8d7da; /* rouge clair */
    }
  </style>
</head>
<body>
  <header>
    <h1>Student Attendance System</h1>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Attendance List</a>
    <a href="#">Add Student</a>
    <a href="#">Reports</a>
    <a href="#">Logout</a>
  </nav>

  <section>
    <h2>Attendance List</h2>

    <table id="attendanceTable">
      <thead>
        <tr>
          <th rowspan="2">Last Name</th>
          <th rowspan="2">First Name</th>
          <th colspan="2">S1</th>
          <th colspan="2">S2</th>
          <th colspan="2">S3</th>
          <th colspan="2">S4</th>
          <th colspan="2">S5</th>
          <th colspan="2">S6</th>
          <th rowspan="2">Message</th>
        </tr>
        <tr>
          <th>P</th><th>Pa</th>
          <th>P</th><th>Pa</th>
          <th>P</th><th>Pa</th>
          <th>P</th><th>Pa</th>
          <th>P</th><th>Pa</th>
          <th>P</th><th>Pa</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Ahmed</td>
          <td>Sara</td>
          <td><input type="checkbox" class="P"></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P"></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P"></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P"></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P"></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P"></td><td><input type="checkbox" class="A"></td>
          <td class="message"></td>
        </tr>

        <tr>
          <td>Yacine</td>
          <td>Ali</td>
          <td><input type="checkbox" class="P" checked></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P"></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P" checked></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P" checked></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P" checked></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P"></td><td><input type="checkbox" class="A"></td>
          <td class="message"></td>
        </tr>

        <tr>
          <td>Rania</td>
          <td>Houcine</td>
          <td><input type="checkbox" class="P"></td><td><input type="checkbox" class="A" checked></td>
          <td><input type="checkbox" class="P" checked></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P" checked></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P"></td><td><input type="checkbox" class="A" checked></td>
          <td><input type="checkbox" class="P"></td><td><input type="checkbox" class="A" checked></td>
          <td><input type="checkbox" class="P"></td><td><input type="checkbox" class="A"></td>
          <td class="message"></td>
        </tr>
      </tbody>
    </table>
  </section>

  <script>
    function updateTable() {
      const rows = document.querySelectorAll("#attendanceTable tbody tr");

      rows.forEach(row => {
        const presentChecks = row.querySelectorAll('input.P');
        const absentChecks = row.querySelectorAll('input.A');
        const messageCell = row.querySelector('.message');

        let participations = 0;
        let absences = 0;

        for (let i = 0; i < presentChecks.length; i++) {
          if (presentChecks[i].checked) participations++;
          if (absentChecks[i].checked) absences++;
        }

        // Définir couleur et message selon absences
        row.classList.remove('good', 'warning', 'bad');
        if (absences < 3) {
          row.classList.add('good');
          messageCell.textContent = `Good attendance – Excellent participation (${absences} abs, ${participations} par)`;
        } else if (absences >= 3 && absences <= 4) {
          row.classList.add('warning');
          messageCell.textContent = `Warning – attendance low – You need to participate more (${absences} abs, ${participations} par)`;
        } else {
          row.classList.add('bad');
          messageCell.textContent = `Excluded – too many absences – You need to participate more (${absences} abs, ${participations} par)`;
        }
      });
    }

    // Assure qu'on ne coche jamais P et A en même temps
    document.querySelectorAll("#attendanceTable input").forEach(chk => {
      chk.addEventListener("change", e => {
        const cell = e.target.closest("td");
        const row = e.target.closest("tr");
        const inputsInSameSession = cell.parentNode.querySelectorAll("input");

        // Décoche l'autre case du même couple (P/Pa)
        if (e.target.classList.contains("P")) {
          const correspondingA = e.target.parentElement.nextElementSibling.querySelector(".A");
          if (correspondingA) correspondingA.checked = false;
        } else if (e.target.classList.contains("A")) {
          const correspondingP = e.target.parentElement.previousElementSibling.querySelector(".P");
          if (correspondingP) correspondingP.checked = false;
        }

        updateTable();
      });
    });

    // Mise à jour initiale
    updateTable();
  </script>
</body>
</html>
