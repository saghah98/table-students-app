<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Attendance System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f7f9fc;
    }

    header {
      background-color: #0096c7;
      color: white;
      padding: 10px 20px;
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: center;
      background-color: #00b4d8;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      display: block;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    nav a:hover {
      background-color: #0077b6;
    }

    section {
      padding: 20px;
    }

    h2 {
      color: #0077b6;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: center;
    }

    th {
      background-color: #90e0ef;
    }

    .good {
      background-color: #d4edda; 
    }
    .warning {
      background-color: #fff3cd; 
    }
    .bad {
      background-color: #f8d7da; 
    }
    form {
      background-color: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin: 10px 0 5px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background-color: #00b4d8;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0077b6;
    }

    .error {
      color: red;
      font-size: 14px;
      margin-bottom: 10px;
    }

    @media (min-width: 600px) {
      form {
        width: 60%;
        margin: 20px auto;
      }
    }

    .success {
      color: green;
      font-weight: bold;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Student Attendance System</h1>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Attendance List</a>
    <a href="#">Add Student</a>
    <a href="#">Reports</a>
    <a href="#">Logout</a>
  </nav>

  <section>
    <h2>Attendance List</h2>

    <table id="attendanceTable">
      <thead>
        <tr>
          <th rowspan="2">Last Name</th>
          <th rowspan="2">First Name</th>
          <th colspan="2">S1</th>
          <th colspan="2">S2</th>
          <th colspan="2">S3</th>
          <th colspan="2">S4</th>
          <th colspan="2">S5</th>
          <th colspan="2">S6</th>
          <th rowspan="2">Message</th>
        </tr>
        <tr>
          <th>P</th><th>Pa</th>
          <th>P</th><th>Pa</th>
          <th>P</th><th>Pa</th>
          <th>P</th><th>Pa</th>
          <th>P</th><th>Pa</th>
          <th>P</th><th>Pa</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Ahmed</td>
          <td>Sara</td>
          <td><input type="checkbox" class="P"></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P"></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P"></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P"></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P"></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P"></td><td><input type="checkbox" class="A"></td>
          <td class="message"></td>
        </tr>

        <tr>
          <td>Yacine</td>
          <td>Ali</td>
          <td><input type="checkbox" class="P" checked></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P"></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P" checked></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P" checked></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P" checked></td><td><input type="checkbox" class="A"></td>
          <td><input type="checkbox" class="P"></td><td><input type="checkbox" class="A"></td>
          <td class="message"></td>
        </tr>
      </tbody>
    </table>
  </section>

  <section>
    <h2>Add New Student</h2>
    <form id="studentForm" novalidate>
      <label for="studentId">Student ID</label>
      <input type="text" id="studentId" name="studentId" placeholder="Enter Student ID">
      <div class="error" id="idError"></div>

      <label for="lastName">Last Name</label>
      <input type="text" id="lastName" name="lastName" placeholder="Enter Last Name">
      <div class="error" id="lastNameError"></div>

      <label for="firstName">First Name</label>
      <input type="text" id="firstName" name="firstName" placeholder="Enter First Name">
      <div class="error" id="firstNameError"></div>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter Email">
      <div class="error" id="emailError"></div>

      <button type="submit">Submit</button>
      <div class="success" id="successMsg"></div>
    </form>
  </section>

  <script>
  
    function updateTable() {
      const rows = document.querySelectorAll("#attendanceTable tbody tr");

      rows.forEach(row => {
        const presentChecks = row.querySelectorAll('input.P');
        const absentChecks = row.querySelectorAll('input.A');
        const messageCell = row.querySelector('.message');

        let participations = 0;
        let absences = 0;

        for (let i = 0; i < presentChecks.length; i++) {
          if (presentChecks[i].checked) participations++;
          if (absentChecks[i].checked) absences++;
        }

        row.classList.remove('good', 'warning', 'bad');
        if (absences < 3) {
          row.classList.add('good');
          messageCell.textContent = `Good attendance (${absences} abs, ${participations} par)`;
        } else if (absences >= 3 && absences <= 4) {
          row.classList.add('warning');
          messageCell.textContent = `Warning – Low attendance (${absences} abs, ${participations} par)`;
        } else {
          row.classList.add('bad');
          messageCell.textContent = `Excluded – Too many absences (${absences} abs, ${participations} par)`;
        }
      });
    }

    function attachCheckboxListeners(row) {
      row.querySelectorAll("input").forEach(chk => {
        chk.addEventListener("change", e => {
          if (e.target.classList.contains("P")) {
            const correspondingA = e.target.parentElement.nextElementSibling?.querySelector(".A");
            if (correspondingA) correspondingA.checked = false;
          } else if (e.target.classList.contains("A")) {
            const correspondingP = e.target.parentElement.previousElementSibling?.querySelector(".P");
            if (correspondingP) correspondingP.checked = false;
          }
          updateTable();
        });
      });
    }

    document.querySelectorAll("#attendanceTable tbody tr").forEach(attachCheckboxListeners);
    updateTable();

    document.getElementById("studentForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const id = document.getElementById("studentId").value.trim();
      const lastName = document.getElementById("lastName").value.trim();
      const firstName = document.getElementById("firstName").value.trim();
      const email = document.getElementById("email").value.trim();

      const idError = document.getElementById("idError");
      const lastNameError = document.getElementById("lastNameError");
      const firstNameError = document.getElementById("firstNameError");
      const emailError = document.getElementById("emailError");
      const successMsg = document.getElementById("successMsg");

      idError.textContent = "";
      lastNameError.textContent = "";
      firstNameError.textContent = "";
      emailError.textContent = "";
      successMsg.textContent = "";

      let isValid = true;

      if (id === "") {
        idError.textContent = "Student ID is required.";
        isValid = false;
      } else if (!/^[0-9]+$/.test(id)) {
        idError.textContent = "Student ID must contain only numbers.";
        isValid = false;
      }

      if (lastName === "") {
        lastNameError.textContent = "Last Name is required.";
        isValid = false;
      } else if (!/^[A-Za-z]+$/.test(lastName)) {
        lastNameError.textContent = "Last Name must contain only letters.";
        isValid = false;
      }

      if (firstName === "") {
        firstNameError.textContent = "First Name is required.";
        isValid = false;
      } else if (!/^[A-Za-z]+$/.test(firstName)) {
        firstNameError.textContent = "First Name must contain only letters.";
        isValid = false;
      }

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (email === "") {
        emailError.textContent = "Email is required.";
        isValid = false;
      } else if (!emailPattern.test(email)) {
        emailError.textContent = "Enter a valid email address.";
        isValid = false;
      }

      if (isValid) {
        const tbody = document.querySelector("#attendanceTable tbody");
        const newRow = document.createElement("tr");

        newRow.innerHTML = `
          <td>${lastName}</td>
          <td>${firstName}</td>
          ${Array(6).fill('<td><input type="checkbox" class="P"></td><td><input type="checkbox" class="A"></td>').join("")}
          <td class="message"></td>
        `;

        tbody.appendChild(newRow);
        attachCheckboxListeners(newRow);
        updateTable();

        successMsg.textContent = "✅ Student successfully added!";
        this.reset();

        setTimeout(() => (successMsg.textContent = ""), 3000);
      }
    });
  </script>
</body>
</html>
